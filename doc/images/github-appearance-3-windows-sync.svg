<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif">
  <rect width="1200" height="620" fill="#f3f3f3"/>
  <rect x="40" y="40" width="1120" height="540" rx="10" fill="#fbfbfb" stroke="#d0d7de"/>
  <rect x="40" y="40" width="1120" height="48" rx="10" fill="#e9e9e9"/>
  <text x="64" y="70" font-size="15" fill="#1f2328">设置  &gt;  个性化  &gt;  颜色</text>
  <!-- 左导航 -->
  <rect x="40" y="88" width="280" height="492" fill="#f6f6f6"/>
  <text x="64" y="130" font-size="15" fill="#1f2328">系统</text>
  <text x="64" y="166" font-size="15" fill="#1f2328">蓝牙和其他设备</text>
  <text x="64" y="202" font-size="15" fill="#1f2328">网络和 Internet</text>
  <rect x="48" y="220" width="264" height="36" rx="6" fill="#e0e0e0"/>
  <rect x="48" y="220" width="4" height="36" fill="#0067c0"/>
  <text x="64" y="244" font-size="15" font-weight="600" fill="#1f2328">个性化 ⑤</text>
  <text x="88" y="280" font-size="14" fill="#57606a">背景</text>
  <text x="88" y="310" font-size="14" fill="#57606a">颜色</text>
  <text x="88" y="340" font-size="14" fill="#57606a">锁屏界面</text>
  <text x="64" y="380" font-size="15" fill="#1f2328">应用</text>
  <text x="64" y="416" font-size="15" fill="#1f2328">帐户</text>
  <!-- 主区 -->
  <text x="360" y="140" font-size="24" font-weight="600" fill="#1f2328">颜色</text>
  <rect x="360" y="170" width="760" height="120" rx="8" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="384" y="206" font-size="16" fill="#1f2328">选择模式 ⑥</text>
  <rect x="384" y="222" width="260" height="40" rx="6" fill="#ffffff" stroke="#0067c0"/>
  <text x="400" y="248" font-size="15" fill="#1f2328">深色</text>
  <path d="M620 242 l8 8 l14 -14" stroke="#57606a" stroke-width="2" fill="none"/>
  <text x="700" y="248" font-size="14" fill="#57606a">可选：浅色 / 深色 / 自定义</text>
  <rect x="360" y="310" width="760" height="110" rx="8" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="384" y="346" font-size="16" fill="#1f2328">预览</text>
  <rect x="384" y="362" width="340" height="40" rx="4" fill="#202020"/>
  <rect x="740" y="362" width="340" height="40" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="400" y="388" font-size="14" fill="#ffffff">深色模式窗口</text>
  <text x="756" y="388" font-size="14" fill="#1f2328">浅色模式窗口</text>
  <rect x="360" y="450" width="760" height="80" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="384" y="484" font-size="15" fill="#57606a">GitHub 选 Sync with system 后跟随此处设置；macOS 在 系统设置 → 外观</text>
  <text x="384" y="510" font-size="14" fill="#57606a">Windows 10 路径相同：设置 → 个性化 → 颜色 → 选择颜色</text>
</svg>
