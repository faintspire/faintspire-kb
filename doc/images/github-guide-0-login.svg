  <text x="600" y="521" font-size="15" fill="#1f2328" text-anchor="middle">Sign in with a passkey ④</text>
  <text x="600" y="566" font-size="14" fill="#57606a" text-anchor="middle">New to GitHub?  <tspan fill="#0969da">Create an account</tspan></text>
  <text x="40" y="660" font-size="14" fill="#57606a">界面字段依据 github.com/login 真实页面绘制；开启 2FA 后还需输入验证码或使用 passkey / 安全密钥。</text>
