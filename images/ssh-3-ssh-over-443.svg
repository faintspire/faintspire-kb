<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif">
  <rect width="1200" height="620" fill="#f6f8fa"/>
  <text x="40" y="52" font-size="26" font-weight="600" fill="#1f2328">同一台机器、同一个 443 端口：HTTPS 被重置，SSH 畅通</text>

  <!-- 车道 A：HTTPS -->
  <rect x="40" y="90" width="1120" height="150" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="64" y="126" font-size="18" font-weight="600" fill="#cf222e">通道 A · HTTPS（原 origin）</text>
  <rect x="64" y="146" width="220" height="60" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="84" y="182" font-size="15" fill="#1f2328">git push（本机）</text>
  <path d="M290 176 H 470" stroke="#cf222e" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#r)"/>
  <rect x="476" y="146" width="300" height="60" rx="6" fill="#fff5f5" stroke="#cf222e"/>
  <text x="496" y="170" font-size="15" fill="#cf222e">github.com:443（TLS/SNI 可见）</text>
  <text x="496" y="192" font-size="14" fill="#cf222e">间歇性 Recv failure / reset ✗</text>
  <path d="M782 176 H 950" stroke="#d0d7de" stroke-width="3" stroke-dasharray="4 6"/>
  <rect x="956" y="146" width="180" height="60" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="976" y="182" font-size="15" fill="#8c959f">GitHub 收不到</text>

  <!-- 车道 B：SSH over 443 -->
  <rect x="40" y="270" width="1120" height="150" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="64" y="306" font-size="18" font-weight="600" fill="#1a7f37">通道 B · SSH over 443（现 origin）</text>
  <rect x="64" y="326" width="220" height="60" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="84" y="362" font-size="15" fill="#1f2328">git push（本机）</text>
  <path d="M290 356 H 470" stroke="#1a7f37" stroke-width="3" marker-end="url(#g)"/>
  <rect x="476" y="326" width="300" height="60" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="496" y="350" font-size="15" fill="#1a7f37">ssh.github.com:443（SSH 协议）</text>
  <text x="496" y="372" font-size="14" fill="#1a7f37">加密载荷不可识别，稳定 ✓</text>
  <path d="M782 356 H 950" stroke="#1a7f37" stroke-width="3" marker-end="url(#g)"/>
  <rect x="956" y="326" width="180" height="60" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="976" y="362" font-size="15" fill="#1a7f37">Hi faintspire!</text>

  <!-- config -->
  <rect x="40" y="450" width="700" height="140" rx="8" fill="#24292f"/>
  <text x="64" y="482" font-size="14" fill="#7ee787" font-family="Consolas, monospace"># ~/.ssh/config</text>
  <text x="64" y="508" font-size="14" fill="#ffffff" font-family="Consolas, monospace">Host github.com</text>
  <text x="84" y="532" font-size="14" fill="#ffffff" font-family="Consolas, monospace">HostName ssh.github.com</text>
  <text x="84" y="556" font-size="14" fill="#ffffff" font-family="Consolas, monospace">Port 443</text>
  <text x="84" y="580" font-size="14" fill="#ffffff" font-family="Consolas, monospace">User git</text>
  <rect x="770" y="450" width="390" height="140" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="790" y="482" font-size="15" font-weight="600" fill="#1f2328">远程地址随之切换</text>
  <text x="790" y="512" font-size="13" fill="#57606a" font-family="Consolas, monospace">git remote set-url origin</text>
  <text x="790" y="536" font-size="13" fill="#57606a" font-family="Consolas, monospace">  git@github.com:owner/repo.git</text>
  <text x="790" y="570" font-size="14" fill="#57606a">验证：ssh -T git@github.com</text>
  <defs>
    <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#cf222e"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1a7f37"/></marker>
  </defs>
</svg>
