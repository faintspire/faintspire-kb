<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Faintspire 知识库</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <!-- docsify 已本地化至 vendor/，站点零外部 CDN 依赖（2026-09-29） -->
    <link rel="stylesheet" href="vendor/docsify/vue.css">
    <style>
        /* 侧栏分组观感：浅灰底 + 组标题加粗，正文限宽提升可读性 */
        .sidebar { background: #fafbfc; }
        .sidebar li > p { font-weight: 600; color: #57606a; }
        .markdown-section { max-width: 900px; }
        .search { margin-bottom: 12px; }

<body>
<div id="app">加载中…</div>
<script>

        loadSidebar: true,

    }

<script src="vendor/docsify/docsify.min.js"></script>

</html>
