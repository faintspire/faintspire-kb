<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Faintspire 知识库</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
    <style>
        /* 侧栏分组观感：浅灰底 + 组标题加粗，正文限宽提升可读性 */
        .sidebar { background: #fafbfc; }
        .sidebar li > p { font-weight: 600; color: #57606a; }
        .markdown-section { max-width: 900px; }
        .search { margin-bottom: 12px; }
    </style>
</head>
<body>
<div id="app">加载中…</div>
<script>
    window.$docsify = {
        name: 'Faintspire 知识库',
        repo: 'https://github.com/faintspire/faintspire-kb',
        loadSidebar: true,
        subMaxLevel: 3,
        auto2top: true,
        relativePath: true,
        search: {placeholder: '搜索', noData: '无匹配结果', depth: 3}
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
