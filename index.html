<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Faintspire 知识库</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <!-- docsify 及插件均已本地化至 vendor/，站点零外部 CDN 依赖（2026-09-29） -->
    <link rel="stylesheet" href="vendor/docsify/vue.css">
    <link rel="stylesheet" href="vendor/docsify/sidebar.min.css">
    <style>
        body, .markdown-section { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif; }

        /* 左栏：白底、细右边框、280px，条目圆角 hover/选中态 */
        .sidebar { width: 280px; background: #fff; border-right: 1px solid #ebedf0; padding: 16px 0; }
        .content { left: 280px; }
        .sidebar-nav { padding: 0 12px; }
        .sidebar li > p { font-size: 12px; color: #8a8f99; font-weight: 600; margin: 14px 6px 6px; }
        .sidebar-nav a { color: #4d4d4d; font-size: 14px; line-height: 1.6; padding: 6px 10px; border-radius: 6px; display: block; }
        .sidebar-nav a:hover { background: #f4f5f7; color: #262626; text-decoration: none; }
        .sidebar-nav a.active, .sidebar-nav li.active > a { background: #f2f3f5; color: #262626; font-weight: 600; }

        /* 正文：居中限宽、语雀字号行高 */
        .markdown-section { max-width: 780px; padding: 40px 24px; color: #262626; font-size: 15px; line-height: 1.75; }
        .markdown-section h1 { font-size: 28px; font-weight: 700; margin: 8px 0 24px; }
        .markdown-section h2 { font-size: 21px; font-weight: 600; margin: 36px 0 16px; }
        .markdown-section h3 { font-size: 17px; font-weight: 600; margin: 28px 0 12px; }
        .markdown-section a { color: #117cee; text-decoration: none; }
        .markdown-section a:hover { text-decoration: underline; }
        .markdown-section p { margin: 0 0 14px; }
        .markdown-section ul, .markdown-section ol { padding-left: 22px; margin: 0 0 14px; }
        .markdown-section li { margin: 4px 0; }

        /* 表格：细边框 + 浅灰表头 */
        .markdown-section table { border-collapse: collapse; margin: 16px 0; font-size: 14px; }
        .markdown-section th, .markdown-section td { border: 1px solid #e8e8e8; padding: 8px 12px; }
        .markdown-section th { background: #fafafa; font-weight: 600; }

        /* 代码：inline 浅灰底，块级浅灰圆角 */
        .markdown-section code { background: #f2f3f5; color: #4d4d4d; border: none; padding: 2px 6px; border-radius: 4px; font-size: 13px; font-family: Consolas, "JetBrains Mono", monospace; }
        .markdown-section pre { background: #f6f7f8; border-radius: 8px; padding: 14px 16px; margin: 16px 0; }
        .markdown-section pre code { background: transparent; padding: 0; font-size: 13px; line-height: 1.7; }

        /* 引用块与图片 */
        .markdown-section blockquote { background: #f9fafb; border-left: 3px solid #ebedf0; border-radius: 0 6px 6px 0; margin: 16px 0; padding: 10px 16px; color: #595959; }
        .markdown-section blockquote p { margin: 0; }
        .markdown-section img { border-radius: 6px; border: 1px solid #ebedf0; }

        /* 右侧大纲：语雀式（无竖线、层级缩进、hover 蓝） */
        #kb-outline { position: fixed; top: 64px; right: 20px; width: 200px; max-height: calc(100vh - 96px); overflow: auto; border-left: none; padding-left: 0; font-size: 13px; }
        #kb-outline .kb-outline-title { font-size: 12px; font-weight: 600; color: #8a8f99; margin-bottom: 8px; }
        #kb-outline ul { list-style: none; margin: 0; padding: 0; }
        #kb-outline li { margin: 2px 0; }
        #kb-outline li.kb-l3 { padding-left: 14px; }
        #kb-outline a { color: #595959; text-decoration: none; display: block; padding: 3px 6px; border-radius: 4px; }
        #kb-outline a:hover { color: #117cee; background: #f4f5f7; }
        @media (min-width: 1200px) { .content { padding-right: 240px; } }
        @media (max-width: 1199px) { #kb-outline { display: none !important; } }
    </style>
</head>
<body>
<div id="app">加载中…</div>
<script>
    window.$docsify = {
        loadSidebar: true,
        alias: {
            '/.*/_sidebar.md': '/_sidebar.md'
        },
        subMaxLevel: 3,
        sidebarDisplayLevel: 2,
        auto2top: true,
        relativePath: true,
        search: {placeholder: '搜索文档', noData: '无匹配结果', depth: 3},
        plugins: [
            /* 右侧大纲面板：随当前文档的 h2/h3 生成，点击跳转对应小节 */
            function (hook, vm) {
                hook.doneEach(function () {
                    let panel = document.getElementById('kb-outline');
                    if (!panel) {
                        panel = document.createElement('aside');
                        panel.id = 'kb-outline';
                        document.body.appendChild(panel);
                    }
                    const heads = Array.prototype.slice.call(
                        document.querySelectorAll('.markdown-section h2, .markdown-section h3'));
                    if (!heads.length) { panel.style.display = 'none'; return; }
                    panel.style.display = '';
                    let html = '<div class="kb-outline-title">大纲</div><ul>';
                    /* 大纲链接必须用带 .md 的 route.file；route.path 无后缀会导致 Pages 404 */
                    const base = vm.route.path === '/' ? '/' : (vm.route.file || vm.route.path);
                    heads.forEach(function (h) {
                        const cls = h.tagName === 'H3' ? 'kb-l3' : 'kb-l2';
                        html += '<li class="' + cls + '"><a href="#' + base + '?id=' + h.id + '">'
                            + h.textContent + '</a></li>';
                    });
                    panel.innerHTML = html + '</ul>';
                });
            }
        ]
    }
</script>
<script src="vendor/docsify/docsify.min.js"></script>
<script src="vendor/docsify/docsify-sidebar-collapse.min.js"></script>
<script src="vendor/docsify/search.min.js"></script>
</body>
</html>
